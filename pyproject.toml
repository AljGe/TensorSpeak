[project]
name = "inflect-sandbox"
version = "0.1.0"
description = "TensorSpeak Python sandbox for the Inflect Micro/Nano two-stage ONNX TTS pipeline"
requires-python = ">=3.11,<3.12"
license = "GPL-3.0-or-later"

dependencies = [
  # Pinned to match owensong/Inflect-*-v2-ONNX :: onnx/requirements.txt
  "numpy>=1.26,<3",
  "onnxruntime>=1.18,<2",
  "soundfile>=0.13",
  "phonemizer>=3.3",
  "espeakng-loader>=0.2.4",
  "num2words>=0.5.14",
  "Unidecode>=1.3.8",
  # Sandbox-only additions
  "onnx>=1.17",
  "huggingface-hub>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inflect_sandbox"]
